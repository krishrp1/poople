<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poople</title>
<meta name="description" content="A word ladder game: change one letter at a time to reach POOP.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💩%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>POOPLE</h1>
    <p class="sub">Change one letter at a time. Make it to POOP.</p>
  </header>
  <div class="moves">Moves: <span id="count">0</span></div>
  <div id="board"></div>
  <div id="done"><p>You pooped it! New word tomorrow. 💩</p><button id="share">Share result</button></div>
  <div id="kb"></div>
  <div id="toast" role="status"></div>
  <div id="fx"></div>

<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
